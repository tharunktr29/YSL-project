services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  product-service:
    build:
      context: ./product-service
    container_name: product-service
    ports:
      - "8081:8081"
    depends_on:
      - kafka
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:sqlserver://host.docker.internal;instanceName=SQLEXPRESS;databaseName=product_db;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: spring_user
      SPRING_DATASOURCE_PASSWORD: Spring@12345
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092

  cart-service:
    build:
      context: ./cart-service
    container_name: cart-service
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - product-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:sqlserver://host.docker.internal;instanceName=SQLEXPRESS;databaseName=cart_db;encrypt=true;trustServerCertificate=true
      SPRING_DATASOURCE_USERNAME: spring_user
      SPRING_DATASOURCE_PASSWORD: Spring@12345
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      APP_PRODUCT_SERVICE_URL: http://product-service:8081