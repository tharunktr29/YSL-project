spring.datasource.url=jdbc:sqlserver://PROD_DB_HOST:1433;databaseName=product_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=PROD_DB_USERNAME
spring.datasource.password=PROD_DB_PASSWORD
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.kafka.bootstrap-servers=PROD_KAFKA_HOST:9092
spring.kafka.consumer.group-id=product-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.topic.cart-events=cart-events